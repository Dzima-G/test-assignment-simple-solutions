x-app-common: &app-common
  build:
    context: .
    dockerfile: app/Dockerfile
    target: dev
  volumes:
    - ./app:/usr/src/app
    - ./tests:/usr/src/tests
    - ./pyproject.toml:/usr/src/pyproject.toml
    - ./uv.lock:/usr/src/uv.lock

services:

  web:
    container_name: web
    <<: *app-common
    env_file:
      - ./app/core/.env
    ports:
      - 127.0.0.1:8000:8000
    environment:
      - PYTHONPATH=/usr/src
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6
    expose:
      - 5432
    ports:
      - 5432:5432
    env_file:
      - ./app/core/.env
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  test:
    container_name: test
    <<: *app-common
    command: uv run pytest
    env_file:
      - ./app/core/.env
    environment:
      - PYTHONPATH=/usr/src
    profiles:
      - test

volumes:
  pgdata:
    driver: local